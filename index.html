<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; } [hidden] { display: none !important; }</style>
<title>Canyon Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: one centered portrait game stage, HUD drawn on canvas, controls hint below. Single sunset-canyon look by choice. */
  :root {
    --sky-top: #1d2a4d;
    --sky-low: #f6b65b;
    --ink: #fff4e6;
    --ink-soft: #f6d7b8;
    --accent: #ffc861;
    --stage-edge: #140f1f;
    --frame: #3a2a40;
    --font-display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--stage-edge);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
    overflow: hidden;
  }
  #stage {
    position: relative;
    height: min(calc(100% - 60px), 720px);
    aspect-ratio: 9 / 16;
    max-width: 100%;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 0 3px var(--frame), 0 20px 60px rgba(0,0,0,.5);
    touch-action: none;
    cursor: pointer;
  }
  #game { width: 100%; height: 100%; display: block; }
  #stage:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .hint {
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: .04em;
    margin: 0;
    text-align: center;
  }
  /* Phones: the game fills the screen; the on-canvas buttons replace the keyboard hint */
  @media (pointer: coarse) {
    body { padding-block: 0; gap: 0; }
    #stage {
      height: auto;
      width: min(100%, calc(100vh * 9 / 16));
      width: min(100%, calc(100dvh * 9 / 16));
      border-radius: 0;
      box-shadow: none;
    }
    .hint { display: none; }
    #stage:focus-visible { outline: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  }
  kbd {
    font-family: var(--font-body);
    font-weight: 800;
    background: var(--frame);
    border-radius: 5px;
    padding: 1px 6px;
    color: var(--ink);
  }
</style>
</head>
<body>

<div id="stage" tabindex="0" role="application" aria-label="Canyon Run game. Hold the up arrow to climb, the down arrow to dive, the right arrow to boost, space to fire a missile; the jet hovers otherwise.">
  <canvas id="game"></canvas>
</div>
<p class="hint">Hold <kbd>↑</kbd> climb · <kbd>↓</kbd> dive · <kbd>→</kbd> boost · <kbd>Space</kbd> fire · <kbd>P</kbd> pause<br>On touch: hold the top to climb, lower down to dive; Fire and Boost buttons on the ground</p>

<script>
(() => {
  const W = 360, H = 640;          // logical playfield
  const GROUND = 560;              // y of the canyon floor
  const GRAVITY = 1500;            // px/s², only after a crash
  const CLIMB = 320;               // max climb/dive speed px/s; jet hovers level otherwise
  const SPEED = 205;               // scroll px/s
  const GAP = 160;                 // opening between the peak and the overhang
  const TIP = 18;                  // half-width of a peak at its tip
  const SLOPE = 0.2;               // how fast a peak widens toward its base
  const SPACING = 210;             // px between peaks
  const BOOST_MULT = 1.9;          // scroll speed while boosting
  const BOOST_DRAIN = 0.5;         // meter used per second (2 s from full)
  const BOOST_RECHARGE = 0.18;     // meter refilled per second when not boosting
  const BOOST_MIN = 0.15;          // meter needed to start a boost
  const ENEMY_SPEED = 210;         // enemy jets' own speed toward the player, on top of the scroll
  const ENEMY_FIRST = 2.5;         // seconds before the first enemy
  const ENEMY_MIN_GAP = 1.6;       // seconds between enemies: at least this...
  const ENEMY_RANDOM_GAP = 1.6;    // ...plus up to this much more
  const ENEMY_AIM = 0.55;          // how hard enemies steer at the player once close (0..1)
  const ENEMY_POINTS = 3;          // points for shooting one down
  const MAX_AMMO = 2;              // missiles you can carry
  const MISSILE_SPEED = 480;       // px/s
  const MISSILE_TURN = 6;          // how fast a missile can turn toward its target, radians/s
  const MISSILE_RANGE = 380;       // how far ahead the missile's sensor locks on, px
  const PICKUP_CHANCE = 0.4;       // chance a new gap holds a missile pickup
  const FLAP = -390;               // flappy mode: upward kick per tap, px/s
  const FLAPPY_GRAVITY = 1250;     // flappy mode: fall acceleration, px/s²

  // Touch screens get flappy controls (tap to flap, the jet falls otherwise);
  // keyboards get hover controls. #flappy or #hover on the link forces one.
  const FLAPPY = location.hash === '#flappy' ||
    (location.hash !== '#hover' && matchMedia('(pointer: coarse)').matches);

  const canvas = document.getElementById('game');
  const stage = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let best = 0;
  try { best = Number(localStorage.getItem('canyon-run-best')) || 0; } catch (e) {}

  const state = {
    mode: 'ready',     // ready | play | over | paused
    bird: { x: 100, y: 300, vy: 0, r: 15, angle: 0 },
    peaks: [],
    score: 0,
    t: 0,
    groundX: 0,
    dist: 0,           // distance scrolled, drives the background parallax
    fuel: 1,           // boost meter, 0..1
    boosting: false,
    enemies: [],
    missiles: [],
    pickups: [],
    explosions: [],
    popups: [],        // floating "+3" style labels
    ammo: MAX_AMMO,
    fireCooldown: 0,
    enemyTimer: ENEMY_FIRST,
    emptyFlash: 0,     // "no missiles" warning timer
    flash: 0,
    newBest: false,
  };

  function resize() {
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // A peak pair: a mountain rising from the floor and a rock overhang from above.
  // x is the centre line; jag holds the rough edge offsets so each one looks different.
  const SEGMENTS = 10;
  function addPeak(x) {
    const minTop = 70, maxTop = GROUND - GAP - 70;
    const top = minTop + Math.random() * (maxTop - minTop);
    const jag = Array.from({ length: SEGMENTS * 4 + 4 }, () => (Math.random() * 2 - 1) * 6);
    state.peaks.push({ x, top, jag, scored: false });
    if (Math.random() < PICKUP_CHANCE) state.pickups.push({ x, y: top + GAP / 2 });
  }
  // Height of the middle of the canyon gap at any x, blending between neighbouring peaks
  function gapCenterAt(x) {
    const ps = state.peaks;
    if (x <= ps[0].x) return ps[0].top + GAP / 2;
    for (let i = 0; i < ps.length - 1; i++) {
      if (x < ps[i + 1].x) {
        const t = (x - ps[i].x) / (ps[i + 1].x - ps[i].x);
        return ps[i].top + GAP / 2 + t * (ps[i + 1].top - ps[i].top);
      }
    }
    return ps[ps.length - 1].top + GAP / 2;
  }
  function seedPeaks(fromX) {
    state.peaks = [];
    for (let i = 0; i < 4; i++) addPeak(fromX + i * SPACING);
  }

  function reset() {
    state.bird.y = 300; state.bird.vy = 0; state.bird.angle = 0;
    state.score = 0; state.newBest = false;
    state.fuel = 1; state.boosting = false;
    state.enemies = []; state.missiles = []; state.pickups = []; state.explosions = []; state.popups = [];
    state.ammo = MAX_AMMO; state.fireCooldown = 0; state.enemyTimer = ENEMY_FIRST; state.emptyFlash = 0;
    seedPeaks(W + 110);
    state.mode = 'ready';
  }

  const input = { up: false, down: false, boost: false };
  function press(dir) {
    if (state.mode === 'paused') state.mode = 'play';
    if (state.mode === 'over') {
      if (state.t - state.overAt < 0.5) return; // avoid instant restart
      reset();
    }
    if (state.mode === 'ready') state.mode = 'play';
    input[dir] = true;
  }
  function release() { input.up = false; input.down = false; input.boost = false; }

  function flap() {
    press('up'); // starts, resumes or restarts the game
    input.up = false;
    if (state.mode === 'play') state.bird.vy = FLAP;
  }

  function fire() {
    if (state.mode !== 'play') { press('up'); input.up = false; return; } // start, resume or restart
    if (state.ammo <= 0) { state.emptyFlash = 0.8; return; }
    if (state.fireCooldown > 0) return;
    state.ammo--;
    state.fireCooldown = 0.25;
    state.missiles.push({ x: state.bird.x + 20, y: state.bird.y + 8, vx: MISSILE_SPEED, vy: 0, target: null });
  }

  function explode(x, y, r) { state.explosions.push({ x, y, r, t: 0 }); }

  function gameOver() {
    state.mode = 'over';
    state.boosting = false;
    explode(state.bird.x, state.bird.y, 30);
    state.overAt = state.t;
    state.flash = 1;
    if (state.score > best) {
      best = state.score; state.newBest = true;
      try { localStorage.setItem('canyon-run-best', String(best)); } catch (e) {}
    }
  }

  // Is a point inside the rock of this peak pair? Slightly forgiving at the edges.
  function inRock(p, px, py) {
    const bottomTip = p.top + GAP;
    if (py >= bottomTip && Math.abs(px - p.x) < TIP + (py - bottomTip) * SLOPE - 3) return true;
    if (py <= p.top && Math.abs(px - p.x) < TIP + (p.top - py) * SLOPE - 3) return true;
    return false;
  }
  // Points around the jet's outline, relative to its centre
  const JET_POINTS = [[28, 1], [16, -6], [16, 6], [-24, -6], [-24, 6], [8, -9], [0, 7]];

  function update(dt) {
    state.t += dt;
    state.flash = Math.max(0, state.flash - dt * 3);
    const b = state.bird;

    if (state.mode === 'ready') {
      b.y = 300 + Math.sin(state.t * 3) * 8;
      state.dist += SPEED * dt;
      state.groundX = (state.groundX - SPEED * dt) % 24;
      return;
    }
    if (state.mode === 'paused') return;

    for (const x of state.explosions) x.t += dt;
    state.explosions = state.explosions.filter(x => x.t < 0.6);
    for (const p of state.popups) { p.t += dt; p.y -= 30 * dt; }
    state.popups = state.popups.filter(p => p.t < 0.9);
    state.emptyFlash = Math.max(0, state.emptyFlash - dt);

    if (state.mode === 'over') {
      // only a crashed jet falls
      b.vy += GRAVITY * dt;
      b.y += b.vy * dt;
      b.angle = Math.min(1.3, b.angle + dt * 3);
      if (b.y > GROUND - b.r) { b.y = GROUND - b.r; b.vy = 0; }
      return;
    }

    if (FLAPPY) {
      // Flappy: always falling, each tap kicks the jet up
      b.vy = Math.min(b.vy + FLAPPY_GRAVITY * dt, 700);
      b.y += b.vy * dt;
      b.angle = Math.max(-0.4, Math.min(0.9, b.vy / 700));
    } else {
      // Hover: hold altitude unless climbing or diving, easing into the new speed
      const target = input.up ? -CLIMB : input.down ? CLIMB : 0;
      b.vy += (target - b.vy) * Math.min(1, dt * 8);
      b.y += b.vy * dt;
      b.angle = b.vy / 900;
    }

    // Boost: faster scrolling and double points; drains the meter, which refills otherwise
    state.boosting = input.boost && state.fuel > 0 && (state.boosting || state.fuel > BOOST_MIN);
    state.fuel = Math.max(0, Math.min(1, state.fuel + (state.boosting ? -BOOST_DRAIN : BOOST_RECHARGE) * dt));
    const speed = SPEED * (state.boosting ? BOOST_MULT : 1);
    state.dist += speed * dt;
    state.groundX = (state.groundX - speed * dt) % 24;
    for (const p of state.peaks) {
      p.x -= speed * dt;
      if (!p.scored && p.x < b.x - 30) { p.scored = true; state.score += state.boosting ? 2 : 1; }
    }
    if (state.peaks[0].x < -140) {
      state.peaks.shift();
      addPeak(state.peaks[state.peaks.length - 1].x + SPACING);
    }
    state.fireCooldown = Math.max(0, state.fireCooldown - dt);

    // Incoming enemy jets fly toward the player, following the canyon gaps
    state.enemyTimer -= dt;
    if (state.enemyTimer <= 0) {
      state.enemies.push({ x: W + 50, y: gapCenterAt(W + 50), seed: Math.random() * 10 });
      state.enemyTimer = ENEMY_MIN_GAP + Math.random() * ENEMY_RANDOM_GAP;
    }
    for (const e of state.enemies) {
      e.x -= (speed + ENEMY_SPEED) * dt;
      // follow the gap, then dive at the player when within range
      const close = Math.max(0, Math.min(1, (260 - (e.x - b.x)) / 160));
      const target = gapCenterAt(e.x) + (b.y - gapCenterAt(e.x)) * ENEMY_AIM * close;
      e.y += (target - e.y) * Math.min(1, dt * 4);
    }
    state.enemies = state.enemies.filter(e => e.x > -60);

    // Missiles lock on to the nearest enemy jet ahead and steer toward it,
    // until they hit a jet or rock, or leave the screen
    for (const m of state.missiles) {
      let target = null, nearest = MISSILE_RANGE;
      for (const e of state.enemies) {
        const d = Math.hypot(e.x - m.x, e.y - m.y);
        if (e.x > m.x - 10 && d < nearest) { nearest = d; target = e; }
      }
      m.target = target;
      if (target) {
        const heading = Math.atan2(m.vy, m.vx);
        let turn = Math.atan2(target.y - m.y, target.x - m.x) - heading;
        turn = Math.atan2(Math.sin(turn), Math.cos(turn)); // shortest way round
        const a = heading + Math.max(-MISSILE_TURN * dt, Math.min(MISSILE_TURN * dt, turn));
        m.vx = Math.cos(a) * MISSILE_SPEED;
        m.vy = Math.sin(a) * MISSILE_SPEED;
      }
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      const noseX = m.x + m.vx / MISSILE_SPEED * 10, noseY = m.y + m.vy / MISSILE_SPEED * 10;
      const e = state.enemies.find(e => Math.abs(e.x - m.x) < 28 && Math.abs(e.y - m.y) < 14);
      if (e) {
        e.dead = true; m.dead = true;
        explode(e.x, e.y, 26);
        state.score += ENEMY_POINTS;
        state.popups.push({ x: e.x, y: e.y - 24, t: 0, text: `+${ENEMY_POINTS}` });
      } else if (m.x > W + 20 || m.x < -20 || m.y < -20) {
        m.dead = true;
      } else if (noseY >= GROUND || state.peaks.some(p => inRock(p, noseX, noseY))) {
        m.dead = true;
        explode(noseX, Math.min(noseY, GROUND), 12);
      }
    }
    state.enemies = state.enemies.filter(e => !e.dead);
    state.missiles = state.missiles.filter(m => !m.dead);

    // Missile pickups drift with the canyon; flying through one reloads a missile
    for (const k of state.pickups) {
      k.x -= speed * dt;
      if (state.ammo < MAX_AMMO && Math.hypot(k.x - b.x, k.y - b.y) < 28) {
        k.dead = true;
        state.ammo++;
        state.popups.push({ x: k.x, y: k.y - 22, t: 0, text: '+1 missile' });
      }
    }
    state.pickups = state.pickups.filter(k => !k.dead && k.x > -30);

    // Collisions
    if (b.y + 7 >= GROUND) { b.y = GROUND - 7; gameOver(); return; }
    if (b.y - b.r < 4) { b.y = 4 + b.r; b.vy = 0; }
    for (const p of state.peaks) {
      if (Math.abs(p.x - b.x) > 160) continue;
      for (const [dx, dy] of JET_POINTS) {
        if (inRock(p, b.x + dx, b.y + dy)) { gameOver(); return; }
      }
    }
    for (const e of state.enemies) {
      if (Math.abs(e.x - b.x) < 46 && Math.abs(e.y - b.y) < 14) {
        explode(e.x, e.y, 26);
        state.enemies = state.enemies.filter(o => o !== e);
        gameOver();
        return;
      }
    }
  }

  // ---------- Drawing ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#1d2a4d');
    g.addColorStop(0.5, '#8a3f4f');
    g.addColorStop(0.8, '#e0703f');
    g.addColorStop(1, '#f6b65b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND);

    // Low sun with a soft glow
    const sx = 250, sy = 395;
    const glow = ctx.createRadialGradient(sx, sy, 20, sx, sy, 150);
    glow.addColorStop(0, 'rgba(255,214,140,.55)');
    glow.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 200, W, GROUND - 200);
    ctx.fillStyle = '#ffe2a3';
    ctx.beginPath(); ctx.arc(sx, sy, 42, 0, Math.PI * 2); ctx.fill();

    // A distant contrail
    const cx = ((state.t * 12) % (W + 200)) - 100;
    ctx.strokeStyle = 'rgba(255,244,230,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 90, 120); ctx.lineTo(cx, 96); ctx.stroke();

    // Two jagged ridge layers with parallax
    ridge(0.12, 450, 70, '#8a4a5a', 0.013);
    ridge(0.3, 500, 50, '#5a3048', 0.021);
  }
  function tri(v) { const m = ((v % 2) + 2) % 2; return 1 - Math.abs(m - 1); }
  function ridge(par, base, amp, color, freq) {
    const off = reduceMotion ? 0 : state.dist * par;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 6) {
      const u = x + off;
      const y = base - tri(u * freq) * amp - tri(u * freq * 2.7 + 0.3) * amp * 0.35;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, GROUND);
    ctx.fill();
  }

  // One rock spire. tipY is where it points into the gap; endY is the floor or sky edge.
  function drawSpire(p, tipY, endY, jagOffset) {
    const dir = endY > tipY ? 1 : -1;
    const len = Math.abs(endY - tipY);
    const left = [], right = [];
    for (let i = 0; i <= SEGMENTS; i++) {
      const t = i / SEGMENTS;
      const y = tipY + dir * t * len;
      const hw = TIP + t * len * SLOPE;
      const edge = i > 0 && i < SEGMENTS;
      left.push([p.x - hw + (edge ? p.jag[jagOffset + i] : 0), y]);
      right.push([p.x + hw + (edge ? p.jag[jagOffset + SEGMENTS + i] : 0), y]);
    }

    // silhouette
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p.x, tipY - dir * 6); // pointed tip
    for (const [x, y] of left) ctx.lineTo(x, y);
    for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
    ctx.closePath();
    ctx.fillStyle = '#a5523a';
    ctx.fill();
    ctx.clip();

    // shadowed right face
    ctx.fillStyle = '#6e3326';
    ctx.beginPath();
    ctx.moveTo(p.x, tipY - dir * 6);
    for (let i = 0; i < right.length; i++) {
      const mid = p.x + (right[i][0] - p.x) * 0.1 + (i % 2 ? 3 : -3);
      ctx.lineTo(mid, right[i][1]);
    }
    for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i][0] + 8, right[i][1]);
    ctx.closePath();
    ctx.fill();

    // sandstone strata
    ctx.strokeStyle = 'rgba(255,200,140,.18)';
    ctx.lineWidth = 3;
    for (let k = 1; k < 8; k++) {
      const y = tipY + dir * (k * 34 + 10);
      ctx.beginPath(); ctx.moveTo(p.x - 200, y); ctx.lineTo(p.x + 200, y + dir * 4); ctx.stroke();
    }

    // sunlit left rim
    ctx.strokeStyle = '#e08a55';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x, tipY - dir * 6);
    for (const [x, y] of left) ctx.lineTo(x + 1, y);
    ctx.stroke();
    ctx.restore();
  }

  function drawGround() {
    ctx.fillStyle = '#5a2f22';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#b8693d';
    ctx.fillRect(0, GROUND, W, 10);
    ctx.fillStyle = '#8a4a2c';
    for (let x = state.groundX - 24; x < W + 24; x += 24) {
      ctx.fillRect(x, GROUND + 18, 12, 3);
      ctx.fillRect(x + 8, GROUND + 34, 8, 3);
    }
  }

  const PLAYER_COLORS = { fin: '#5f687d', body: '#a3abbd', belly: '#7d8599', nose: '#3b3550', wing: '#6f7890', canopy: '#7fd3f0', mark: '#d9473a' };
  const ENEMY_COLORS = { fin: '#24262f', body: '#4e5363', belly: '#363a46', nose: '#1b1d24', wing: '#3a3e4a', canopy: '#ff9a7a', mark: '#ffc861' };

  function drawJet() {
    const b = state.bird;
    // afterburner flickers, flares while climbing or boosting, out after a crash
    const flare = state.mode === 'over' ? 0 : (state.boosting ? 2.6 : input.up || (FLAPPY && b.vy < -150) ? 1.6 : 1) * (0.8 + 0.2 * Math.sin(state.t * 50));
    drawPlane(b.x, b.y, b.angle, false, PLAYER_COLORS, flare);
  }

  function drawPlane(x, y, angle, facingLeft, c, flare) {
    ctx.save();
    ctx.translate(x, y);
    if (facingLeft) ctx.scale(-1, 1);
    ctx.rotate(angle);
    if (flare > 0) {
      ctx.fillStyle = '#ff8a3a';
      ctx.beginPath(); ctx.ellipse(-28 - 6 * flare, 0, 10 * flare, 4.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe28a';
      ctx.beginPath(); ctx.ellipse(-27 - 3 * flare, 0, 5 * flare, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    }
    // vertical tail fin
    ctx.fillStyle = c.fin;
    ctx.beginPath(); ctx.moveTo(-24, -4); ctx.lineTo(-30, -18); ctx.lineTo(-22, -18); ctx.lineTo(-10, -4); ctx.closePath(); ctx.fill();
    // fuselage with pointed nose
    ctx.fillStyle = c.body;
    ctx.beginPath();
    ctx.moveTo(32, 1); ctx.lineTo(16, -6); ctx.lineTo(-24, -6); ctx.lineTo(-27, 0); ctx.lineTo(-24, 6); ctx.lineTo(16, 6);
    ctx.closePath(); ctx.fill();
    // belly shade
    ctx.fillStyle = c.belly;
    ctx.fillRect(-24, 2, 40, 4);
    // nose tip
    ctx.fillStyle = c.nose;
    ctx.beginPath(); ctx.moveTo(32, 1); ctx.lineTo(24, -2.5); ctx.lineTo(24, 4); ctx.closePath(); ctx.fill();
    // canopy
    ctx.fillStyle = c.canopy;
    ctx.beginPath(); ctx.ellipse(10, -6, 9, 4.5, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillRect(6, -9, 5, 1.5);
    // swept delta wing
    ctx.fillStyle = c.wing;
    ctx.beginPath(); ctx.moveTo(10, 2); ctx.lineTo(-14, 16); ctx.lineTo(-20, 16); ctx.lineTo(-16, 2); ctx.closePath(); ctx.fill();
    // stripe and roundel
    ctx.fillStyle = c.mark;
    ctx.fillRect(-20, -2, 6, 3);
    ctx.beginPath(); ctx.arc(-6, 0, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawMissile(x, y, lit, angle = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    if (lit) {
      ctx.fillStyle = '#ffb347';
      ctx.beginPath(); ctx.ellipse(-13, 0, 4 + Math.random() * 3, 2, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#5f687d';
    ctx.fillRect(-9, -4, 3, 8);
    ctx.fillStyle = '#e6e9f0';
    ctx.fillRect(-9, -2, 16, 4);
    ctx.fillStyle = '#d9473a';
    ctx.beginPath(); ctx.moveTo(7, -2); ctx.lineTo(12, 0); ctx.lineTo(7, 2); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Red corner brackets around a jet a missile has locked on to
  function drawLock(e) {
    const s = 30 + Math.sin(state.t * 20) * 2, c = 9;
    ctx.strokeStyle = '#ff4d4d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const cx = e.x + sx * s, cy = e.y + sy * (s - 8);
      ctx.moveTo(cx - sx * c, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy - sy * c);
    }
    ctx.stroke();
  }

  function drawPickup(k) {
    const r = 15 + Math.sin(state.t * 5) * 1.5;
    ctx.fillStyle = 'rgba(255,200,97,.25)';
    ctx.beginPath(); ctx.arc(k.x, k.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffc861';
    ctx.lineWidth = 2;
    ctx.stroke();
    drawMissile(k.x, k.y, false);
  }

  function drawExplosion(x) {
    const k = x.t / 0.6;
    ctx.fillStyle = `rgba(255,${Math.round(190 - 110 * k)},70,${1 - k})`;
    ctx.beginPath(); ctx.arc(x.x, x.y, x.r * (0.4 + k), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,240,180,${Math.max(0, 1 - k * 1.6)})`;
    ctx.beginPath(); ctx.arc(x.x, x.y, x.r * 0.5 * (0.4 + k), 0, Math.PI * 2); ctx.fill();
  }

  function text(str, x, y, size, color = '#fff4e6', align = 'center', font = 'Bagel Fat One') {
    ctx.font = `${size}px "${font}", "Arial Rounded MT Bold", sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = size / 6;
    ctx.strokeStyle = '#1d1424';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function panel(x, y, w, h) {
    ctx.fillStyle = 'rgba(29,20,36,.85)';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 16); ctx.fill();
    ctx.strokeStyle = '#ffc861'; ctx.lineWidth = 3; ctx.stroke();
  }

  // Boost button and meter, drawn on the canyon floor
  const BOOST_BTN = { x: 196, y: 574, w: 148, h: 52 };
  function drawBoost() {
    const { x, y, w, h } = BOOST_BTN;
    const ready = state.boosting || state.fuel > BOOST_MIN;
    ctx.fillStyle = 'rgba(29,20,36,.75)';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill();
    ctx.fillStyle = state.boosting ? '#ff8a3a' : ready ? '#ffc861' : '#8a6a5a';
    ctx.beginPath(); ctx.roundRect(x + 4, y + 4, (w - 8) * state.fuel, h - 8, 9); ctx.fill();
    ctx.strokeStyle = state.boosting ? '#ffe28a' : '#ffc861';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.stroke();
    text('BOOST', x + w / 2, y + h / 2 + 1, 20);
  }

  // Fire button with one slot per missile, on the left of the canyon floor
  const FIRE_BTN = { x: 16, y: 574, w: 148, h: 52 };
  function drawFire() {
    const { x, y, w, h } = FIRE_BTN;
    const empty = state.ammo === 0;
    ctx.fillStyle = 'rgba(29,20,36,.75)';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill();
    ctx.strokeStyle = state.emptyFlash > 0 ? '#ef6b3a' : empty ? '#8a6a5a' : '#ffc861';
    ctx.lineWidth = 2;
    ctx.stroke();
    text('FIRE', x + 42, y + h / 2 + 1, 20, empty ? '#8a6a5a' : '#fff4e6');
    for (let i = 0; i < MAX_AMMO; i++) {
      ctx.globalAlpha = i < state.ammo ? 1 : 0.25;
      drawMissile(x + 96 + i * 30, y + h / 2, false);
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    if (state.mode !== 'over') { drawBoost(); drawFire(); }
    for (const p of state.popups) {
      ctx.globalAlpha = 1 - p.t / 0.9;
      text(p.text, p.x, p.y, 18, '#ffc861', 'center', 'Nunito');
    }
    ctx.globalAlpha = 1;
    if (state.mode === 'play' || state.mode === 'paused') {
      text(String(state.score), W / 2, 70, 54);
      if (state.boosting) text('2× points', W / 2, 112, 18, '#ffc861', 'center', 'Nunito');
      if (state.emptyFlash > 0) text('Out of missiles: grab a pickup', W / 2, 540, 16, '#ef6b3a', 'center', 'Nunito');
    }
    if (state.mode === 'ready') {
      text('Canyon', W / 2, 150, 52, '#ffc861');
      text('Run', W / 2, 205, 52, '#ff8a3a');
      const pulse = reduceMotion ? 1 : 0.75 + 0.25 * Math.sin(state.t * 4);
      ctx.globalAlpha = pulse;
      text(FLAPPY ? 'Tap to take off' : 'Press ↑ to take off', W / 2, 400, 22);
      ctx.globalAlpha = 1;
      if (best > 0) text(`Best ${best}`, W / 2, 440, 18, '#f6d7b8', 'center', 'Nunito');
      if (FLAPPY) {
        text('Tap anywhere to flap up', W / 2, 475, 15, '#f6d7b8', 'center', 'Nunito');
        text('Hold BOOST for double points', W / 2, 500, 15, '#ffc861', 'center', 'Nunito');
        text('Tap FIRE to shoot · fly through ◯ to reload', W / 2, 525, 15, '#f6d7b8', 'center', 'Nunito');
      } else {
        text('↑ climb · ↓ dive · let go to hover', W / 2, 475, 15, '#f6d7b8', 'center', 'Nunito');
        text('→ boost for double points', W / 2, 500, 15, '#ffc861', 'center', 'Nunito');
        text('Space fires · fly through ◯ to reload', W / 2, 525, 15, '#f6d7b8', 'center', 'Nunito');
      }
    }
    if (state.mode === 'paused') {
      text('Paused', W / 2, 280, 40);
      text('Tap or P to resume', W / 2, 330, 18, '#f6d7b8', 'center', 'Nunito');
    }
    if (state.mode === 'over') {
      panel(50, 190, W - 100, 210);
      text('Game over', W / 2, 228, 34, '#ef6b3a');
      text('Score', W / 2 - 64, 280, 16, '#f6d7b8', 'center', 'Nunito');
      text('Best', W / 2 + 64, 280, 16, '#f6d7b8', 'center', 'Nunito');
      text(String(state.score), W / 2 - 64, 318, 40);
      text(String(best), W / 2 + 64, 318, 40, '#ffc861');
      if (state.newBest) text('New best!', W / 2, 362, 18, '#ffc861');
      if (state.t - state.overAt > 0.5) text(FLAPPY ? 'Tap to fly again' : 'Press ↑ to fly again', W / 2, 440, 20);
    }
  }

  function draw() {
    drawSky();
    for (const p of state.peaks) {
      drawSpire(p, p.top, -10, 0);
      drawSpire(p, p.top + GAP, GROUND + 10, SEGMENTS * 2 + 2);
    }
    for (const k of state.pickups) drawPickup(k);
    drawGround();
    if (state.boosting && !reduceMotion) {
      // speed streaks
      ctx.strokeStyle = 'rgba(255,244,230,.35)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 9; i++) {
        const y = (i * 71 + 13) % (GROUND - 20);
        const x = W + 40 - ((state.dist * 1.5 + i * 97) % (W + 80));
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 46, y); ctx.stroke();
      }
    }
    for (const e of state.enemies) {
      drawPlane(e.x, e.y, 0, true, ENEMY_COLORS, 0.8 + 0.2 * Math.sin(state.t * 50 + e.seed));
    }
    for (const e of new Set(state.missiles.map(m => m.target).filter(e => e && !e.dead))) drawLock(e);
    for (const m of state.missiles) drawMissile(m.x, m.y, true, Math.atan2(m.vy, m.vx));
    if (state.mode !== 'over' || state.t - state.overAt < 0.15) drawJet();
    for (const x of state.explosions) drawExplosion(x);
    drawHUD();
    if (state.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${state.flash * 0.6})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- Input ----------
  const UP_KEYS = ['ArrowUp', 'KeyW'];
  const FIRE_KEYS = ['Space', 'KeyF', 'Enter'];
  const DOWN_KEYS = ['ArrowDown', 'KeyS'];
  const BOOST_KEYS = ['ArrowRight', 'KeyD', 'ShiftLeft', 'ShiftRight'];
  // Each finger remembers what it is holding, so a thumb can keep Boost held while the other taps
  const held = new Map();
  stage.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    stage.focus();
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    // Canyon floor: Fire on the left, Boost on the right.
    // Above it: flappy mode flaps; hover mode climbs in the top part and dives lower down.
    const r = stage.getBoundingClientRect();
    const ly = (e.clientY - r.top) / r.height * H;
    const lx = (e.clientX - r.left) / r.width * W;
    if (ly > GROUND) {
      if (lx < W / 2) fire();
      else { press('boost'); held.set(e.pointerId, 'boost'); }
    } else if (FLAPPY) {
      flap();
    } else {
      const dir = ly > H * 0.6 ? 'down' : 'up';
      press(dir);
      held.set(e.pointerId, dir);
    }
  });
  const lift = (e) => {
    const action = held.get(e.pointerId);
    if (action) { input[action] = false; held.delete(e.pointerId); }
  };
  stage.addEventListener('pointerup', lift);
  stage.addEventListener('pointercancel', lift);
  window.addEventListener('blur', () => { release(); held.clear(); });
  window.addEventListener('keyup', (e) => {
    if (UP_KEYS.includes(e.code)) input.up = false;
    if (DOWN_KEYS.includes(e.code)) input.down = false;
    if (BOOST_KEYS.includes(e.code)) input.boost = false;
  });
  window.addEventListener('keydown', (e) => {
    if (UP_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) FLAPPY ? flap() : press('up'); }
    if (DOWN_KEYS.includes(e.code) && !FLAPPY) { e.preventDefault(); if (!e.repeat) press('down'); }
    if (BOOST_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press('boost'); }
    if (FIRE_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) fire(); }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state.mode === 'play') state.mode = 'paused';
      else if (state.mode === 'paused') state.mode = 'play';
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.mode === 'play') state.mode = 'paused';
  });

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
