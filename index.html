<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140f1f">
<style>body { margin: 0; } [hidden] { display: none !important; }</style>
<title>Canyon Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&family=Press+Start+2P&display=swap">
<style>
  /* Layout: full-screen landscape stage; HUD and buttons drawn on the canvas; HTML only for initials entry and the rotate prompt. Single sunset-canyon look by choice. */
  :root {
    --ink: #fff4e6;
    --ink-soft: #f6d7b8;
    --accent: #ffc861;
    --hot: #ff8a3a;
    --panel: #1d1424;
    --stage-edge: #140f1f;
    --frame: #3a2a40;
    --font-display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-arcade: "Press Start 2P", ui-monospace, "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--stage-edge);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #frame { width: 100%; height: 100%; display: grid; place-items: center; }
  #game { display: block; cursor: pointer; }
  #game:focus { outline: none; }
  #game:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

  /* Arcade initials entry, shown over the game-over screen */
  #initials {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 22px 28px;
    background: var(--panel);
    border: 3px solid var(--accent);
    border-radius: 16px;
    box-shadow: 0 16px 50px rgba(0,0,0,.55);
    font-family: var(--font-arcade);
    text-align: center;
    max-width: calc(100vw - 32px);
    box-sizing: border-box;
  }
  #initials h2 { margin: 0; font-size: 16px; color: var(--accent); letter-spacing: .06em; }
  #initials p { margin: 0; font-size: 11px; color: var(--ink-soft); line-height: 1.6; }
  #initials label { font-size: 10px; color: var(--ink-soft); letter-spacing: .1em; }
  #ini {
    width: 5.2em;
    font: 28px var(--font-arcade);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: .25em;
    padding: 10px 0 10px .25em;
    background: var(--stage-edge);
    color: var(--ink);
    border: 2px solid var(--frame);
    border-radius: 8px;
  }
  #ini:focus { outline: none; border-color: var(--accent); }
  #initials button {
    font: 13px var(--font-arcade);
    padding: 12px 22px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--panel);
    cursor: pointer;
  }
  #initials button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* Phones held upright are asked to turn sideways */
  #rotate {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    background: var(--stage-edge);
    text-align: center;
  }
  #rotate strong { font: 28px var(--font-display); color: var(--accent); }
  #rotate span { color: var(--ink-soft); font-size: 15px; max-width: 26ch; }
  #rotate svg { width: 72px; height: 72px; }
  @media (pointer: coarse) and (orientation: portrait) {
    #rotate { display: flex; }
  }
  @media (prefers-reduced-motion: no-preference) {
    #rotate svg { animation: tip 2.4s ease-in-out infinite; }
    @keyframes tip { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="frame">
    <canvas id="game" tabindex="0" role="application" aria-label="Canyon Run game. Hold the up arrow to climb, the down arrow to dive, the right arrow to boost, space to fire a missile."></canvas>
  </div>
</div>

<form id="initials" hidden autocomplete="off">
  <h2>NEW HIGH SCORE</h2>
  <p id="ini-score"></p>
  <label for="ini">ENTER YOUR INITIALS</label>
  <input id="ini" maxlength="3" autocapitalize="characters" spellcheck="false" enterkeyhint="done">
  <button type="submit">SAVE</button>
</form>

<div id="rotate" role="alert">
  <svg viewBox="0 0 72 72" aria-hidden="true"><rect x="22" y="8" width="28" height="56" rx="6" fill="none" stroke="#ffc861" stroke-width="4"/><circle cx="36" cy="56" r="3" fill="#ffc861"/></svg>
  <strong>Turn your phone sideways</strong>
  <span>Canyon Run plays in landscape. Your run is paused until you rotate.</span>
</div>

<script>
(() => {
  // ---------- Tuning ----------
  const H = 540;                   // logical height; width follows the screen shape
  let W = 960;
  const GROUND = 470;              // y of the canyon floor
  const PLAYER_X = 170;            // jet's fixed horizontal position
  const GRAVITY = 1500;            // px/s², only after a crash
  const CLIMB = 370;               // hover mode: max climb/dive speed px/s
  const SPEED = 270;               // scroll px/s
  const GAP = 215;                 // opening between a peak and the overhang above it
  const TIP = 18;                  // half-width of a rock spire at its point
  const SLOPE = 0.2;               // how fast a spire widens away from its point
  const SPACING = 280;             // px between peaks
  const BOOST_MULT = 1.8;          // scroll speed while boosting
  const BOOST_DRAIN = 0.5;         // meter used per second (2 s from full)
  const BOOST_RECHARGE = 0.18;     // meter refilled per second when not boosting
  const BOOST_MIN = 0.15;          // meter needed to start a boost
  const ENEMY_SPEED = 230;         // enemy jets' own speed toward the player, on top of the scroll
  const ENEMY_FIRST = 2.5;         // seconds before the first enemy
  const ENEMY_MIN_GAP = 1.3;       // seconds between enemies: at least this...
  const ENEMY_RANDOM_GAP = 1.4;    // ...plus up to this much more
  const ENEMY_AIM = 0.55;          // how hard enemies steer at the player once close (0..1)
  const ENEMY_POINTS = 3;          // points for shooting one down
  const MAX_AMMO = 2;              // missiles you can carry
  const MISSILE_SPEED = 560;       // px/s
  const MISSILE_TURN = 6;          // how fast a missile can turn toward its target, radians/s
  const MISSILE_RANGE = 480;       // how far ahead the missile's sensor locks on, px
  const BLAST = 80;                // rock a missile knocks off a spire's top, px
  const PICKUP_CHANCE = 0.4;       // chance a new gap holds a missile pickup
  const LASER_CHANCE = 0.12;       // chance a new gap holds a laser token instead
  const LASER_TIME = 5;            // seconds the laser stays on
  const LASER_CUT = 240;           // rock the laser melts per second, px
  const FLAP = -410;               // flappy mode: upward kick per tap, px/s
  const FLAPPY_GRAVITY = 1300;     // flappy mode: fall acceleration, px/s²
  const MAX_SCORES = 10;           // rows on the personal scoreboard

  // Touch screens get flappy controls (tap to flap, the jet falls otherwise);
  // keyboards get hover controls. #flappy or #hover on the link forces one.
  const FLAPPY = location.hash === '#flappy' ||
    (location.hash !== '#hover' && matchMedia('(pointer: coarse)').matches);
  const portraitPhone = matchMedia('(pointer: coarse) and (orientation: portrait)');

  const canvas = document.getElementById('game');
  const frameEl = document.getElementById('frame');
  const ctx = canvas.getContext('2d');
  const form = document.getElementById('initials');
  const iniInput = document.getElementById('ini');
  const iniScore = document.getElementById('ini-score');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canFullscreen = !!(document.fullscreenEnabled && document.documentElement.requestFullscreen);

  // ---------- Personal scoreboard (this browser only) ----------
  function load(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch (e) { return fallback; }
  }
  function store(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  let scores = load('canyon-run-scores', []);
  if (!Array.isArray(scores)) scores = [];
  let best = Math.max(scores.length ? scores[0].s : 0, Number(load('canyon-run-best', 0)) || 0);
  let lastInitials = load('canyon-run-initials', 'ACE');

  function qualifies(s) {
    return s > 0 && (scores.length < MAX_SCORES || s > scores[scores.length - 1].s);
  }
  function saveScore(name) {
    const entry = { n: name, s: state.score, k: state.kills, d: new Date().toISOString().slice(0, 10) };
    scores.push(entry);
    scores.sort((a, b) => b.s - a.s);
    scores = scores.slice(0, MAX_SCORES);
    state.lastEntry = entry;
    store('canyon-run-scores', scores);
  }

  const state = {
    mode: 'ready',     // ready | play | over | paused
    bird: { x: PLAYER_X, y: 250, vy: 0, r: 15, angle: 0 },
    peaks: [],
    enemies: [],
    missiles: [],
    pickups: [],
    explosions: [],
    debris: [],
    popups: [],        // floating "+3" style labels
    score: 0,
    kills: 0,
    t: 0,
    groundX: 0,
    dist: 0,           // distance scrolled, drives the background parallax
    fuel: 1,           // boost meter, 0..1
    boosting: false,
    ammo: MAX_AMMO,
    fireCooldown: 0,
    enemyTimer: ENEMY_FIRST,
    emptyFlash: 0,     // "no missiles" warning timer
    laser: 0,          // seconds of laser left
    beamEnd: 0,
    flash: 0,
    newBest: false,
    entering: false,   // typing initials
    lastEntry: null,
  };

  function resize() {
    const r = frameEl.getBoundingClientRect();
    if (!r.width || !r.height) return;
    W = Math.round(H * Math.min(2.2, Math.max(4 / 3, r.width / r.height)));
    const scale = Math.min(r.width / W, r.height / H);
    canvas.style.width = `${W * scale}px`;
    canvas.style.height = `${H * scale}px`;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    if (state.peaks.length) fillPeaks();
  }
  new ResizeObserver(resize).observe(frameEl);

  // ---------- Canyon ----------
  // A peak pair: a mountain rising from the floor and a rock overhang from above.
  // top/bot are where each spire currently ends (blasting moves them away from the gap);
  // top0/bot0 are where they originally pointed, which sets their width.
  const SEGMENTS = 10;
  function addPeak(x) {
    const minTop = 40, maxTop = GROUND - GAP - 40;
    const top = minTop + Math.random() * (maxTop - minTop);
    const jag = Array.from({ length: SEGMENTS * 4 + 4 }, () => (Math.random() * 2 - 1) * 6);
    state.peaks.push({ x, top, bot: top + GAP, top0: top, bot0: top + GAP, jag, scored: false });
    const roll = Math.random();
    if (roll < PICKUP_CHANCE) state.pickups.push({ kind: 'missile', x, y: top + GAP / 2 });
    else if (roll < PICKUP_CHANCE + LASER_CHANCE) state.pickups.push({ kind: 'laser', x, y: top + GAP / 2 });
  }
  function fillPeaks() {
    const ps = state.peaks;
    if (!ps.length) addPeak(W + 140);
    while (ps[ps.length - 1].x < W + 280) addPeak(ps[ps.length - 1].x + SPACING);
  }
  // Height of the middle of the canyon gap at any x, blending between neighbouring peaks
  function gapCenterAt(x) {
    const ps = state.peaks;
    const mid = (p) => (Math.max(p.top, 0) + Math.min(p.bot, GROUND)) / 2;
    if (x <= ps[0].x) return mid(ps[0]);
    for (let i = 0; i < ps.length - 1; i++) {
      if (x < ps[i + 1].x) {
        const t = (x - ps[i].x) / (ps[i + 1].x - ps[i].x);
        return mid(ps[i]) + t * (mid(ps[i + 1]) - mid(ps[i]));
      }
    }
    return mid(ps[ps.length - 1]);
  }
  // Which spire of this pair, if any, is at this point? Slightly forgiving at the edges.
  function rockAt(p, x, y) {
    if (p.bot < GROUND && y >= p.bot && Math.abs(x - p.x) < TIP + (y - p.bot0) * SLOPE - 3) return 'bot';
    if (p.top > 0 && y <= p.top && Math.abs(x - p.x) < TIP + (p.top0 - y) * SLOPE - 3) return 'top';
    return null;
  }
  function rockHit(x, y) {
    for (const p of state.peaks) {
      if (Math.abs(p.x - x) > 140) continue;
      const part = rockAt(p, x, y);
      if (part) return { p, part };
    }
    return null;
  }
  // Knock rock off a spire's end, throwing debris
  function blast(p, part, amount, x, y, pieces) {
    if (part === 'top') p.top = Math.max(-40, p.top - amount);
    else p.bot = Math.min(GROUND + 40, p.bot + amount);
    for (let i = 0; i < pieces; i++) {
      state.debris.push({
        x, y,
        vx: (Math.random() - 0.3) * 260,
        vy: (part === 'top' ? -1 : 1) * Math.random() * 120 - 160,
        t: 0,
        s: 3 + Math.random() * 4,
        c: Math.random() < 0.5 ? '#a5523a' : '#6e3326',
      });
    }
  }

  function reset() {
    state.bird.y = 250; state.bird.vy = 0; state.bird.angle = 0;
    state.score = 0; state.kills = 0; state.newBest = false; state.lastEntry = null;
    state.fuel = 1; state.boosting = false; state.laser = 0;
    state.enemies = []; state.missiles = []; state.pickups = []; state.explosions = []; state.debris = []; state.popups = [];
    state.ammo = MAX_AMMO; state.fireCooldown = 0; state.enemyTimer = ENEMY_FIRST; state.emptyFlash = 0;
    state.peaks = [];
    fillPeaks();
    state.mode = 'ready';
  }

  // ---------- Actions ----------
  const input = { up: false, down: false, boost: false };
  function press(dir) {
    if (state.mode === 'paused') state.mode = 'play';
    if (state.mode === 'over') {
      if (state.entering || state.t - state.overAt < 0.5) return; // avoid instant restart
      reset();
    }
    if (state.mode === 'ready') state.mode = 'play';
    input[dir] = true;
  }
  function release() { input.up = false; input.down = false; input.boost = false; }

  function flap() {
    press('up'); // starts, resumes or restarts the game
    input.up = false;
    if (state.mode === 'play') state.bird.vy = FLAP;
  }

  function fire() {
    if (state.mode !== 'play') { press('up'); input.up = false; return; } // start, resume or restart
    if (state.ammo <= 0) { state.emptyFlash = 0.8; return; }
    if (state.fireCooldown > 0) return;
    state.ammo--;
    state.fireCooldown = 0.25;
    state.missiles.push({ x: state.bird.x + 20, y: state.bird.y + 8, vx: MISSILE_SPEED, vy: 0, target: null });
  }

  function explode(x, y, r) { state.explosions.push({ x, y, r, t: 0 }); }

  function kill(e) {
    e.dead = true;
    explode(e.x, e.y, 26);
    state.score += ENEMY_POINTS;
    state.kills++;
    state.popups.push({ x: e.x, y: e.y - 24, t: 0, text: `+${ENEMY_POINTS}` });
  }

  function gameOver() {
    state.mode = 'over';
    state.boosting = false;
    state.laser = 0;
    explode(state.bird.x, state.bird.y, 30);
    state.overAt = state.t;
    state.flash = 1;
    release();
    if (state.score > best) {
      best = state.score; state.newBest = true;
      store('canyon-run-best', best);
    }
    if (qualifies(state.score)) openInitials();
  }

  function openInitials() {
    state.entering = true;
    const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 'S'}`;
    iniScore.textContent = `${plural(state.score, 'POINT')} · ${plural(state.kills, 'JET')} DOWN`;
    iniInput.value = lastInitials;
    form.hidden = false;
    setTimeout(() => { iniInput.focus(); iniInput.select(); }, 350);
  }
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = iniInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3) || 'ACE';
    lastInitials = name;
    store('canyon-run-initials', name);
    saveScore(name);
    state.entering = false;
    state.overAt = state.t;
    form.hidden = true;
    iniInput.blur();
    canvas.focus();
  });
  iniInput.addEventListener('input', () => {
    iniInput.value = iniInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
  });

  function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen()
          .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
          .catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    } catch (err) {}
  }

  // ---------- Update ----------
  const JET_POINTS = [[28, 1], [16, -6], [16, 6], [-24, -6], [-24, 6], [8, -9], [0, 7]];

  function update(dt) {
    state.t += dt;
    state.flash = Math.max(0, state.flash - dt * 3);
    const b = state.bird;

    if (state.mode === 'ready') {
      b.y = 250 + Math.sin(state.t * 3) * 8;
      state.dist += SPEED * dt;
      state.groundX = (state.groundX - SPEED * dt) % 24;
      return;
    }
    if (state.mode === 'paused') return;

    for (const x of state.explosions) x.t += dt;
    state.explosions = state.explosions.filter(x => x.t < 0.6);
    for (const d of state.debris) { d.t += dt; d.vy += 900 * dt; d.x += d.vx * dt; d.y += d.vy * dt; }
    state.debris = state.debris.filter(d => d.t < 1.2 && d.y < GROUND + 20);
    for (const p of state.popups) { p.t += dt; p.y -= 30 * dt; }
    state.popups = state.popups.filter(p => p.t < 0.9);
    state.emptyFlash = Math.max(0, state.emptyFlash - dt);

    if (state.mode === 'over') {
      // only a crashed jet falls
      b.vy += GRAVITY * dt;
      b.y += b.vy * dt;
      b.angle = Math.min(1.3, b.angle + dt * 3);
      if (b.y > GROUND - b.r) { b.y = GROUND - b.r; b.vy = 0; }
      return;
    }

    if (FLAPPY) {
      // Flappy: always falling, each tap kicks the jet up
      b.vy = Math.min(b.vy + FLAPPY_GRAVITY * dt, 720);
      b.y += b.vy * dt;
      b.angle = Math.max(-0.4, Math.min(0.9, b.vy / 720));
    } else {
      // Hover: hold altitude unless climbing or diving, easing into the new speed
      const target = input.up ? -CLIMB : input.down ? CLIMB : 0;
      b.vy += (target - b.vy) * Math.min(1, dt * 8);
      b.y += b.vy * dt;
      b.angle = b.vy / 900;
    }

    // Boost: faster scrolling and double points; drains the meter, which refills otherwise
    state.boosting = input.boost && state.fuel > 0 && (state.boosting || state.fuel > BOOST_MIN);
    state.fuel = Math.max(0, Math.min(1, state.fuel + (state.boosting ? -BOOST_DRAIN : BOOST_RECHARGE) * dt));
    const speed = SPEED * (state.boosting ? BOOST_MULT : 1);
    state.dist += speed * dt;
    state.groundX = (state.groundX - speed * dt) % 24;
    for (const p of state.peaks) {
      p.x -= speed * dt;
      if (!p.scored && p.x < b.x - 30) { p.scored = true; state.score += state.boosting ? 2 : 1; }
    }
    while (state.peaks[0].x < -160) state.peaks.shift();
    fillPeaks();
    state.fireCooldown = Math.max(0, state.fireCooldown - dt);

    // Incoming enemy jets fly toward the player, following the canyon gaps
    state.enemyTimer -= dt;
    if (state.enemyTimer <= 0) {
      state.enemies.push({ x: W + 50, y: gapCenterAt(W + 50), seed: Math.random() * 10 });
      state.enemyTimer = ENEMY_MIN_GAP + Math.random() * ENEMY_RANDOM_GAP;
    }
    for (const e of state.enemies) {
      e.x -= (speed + ENEMY_SPEED) * dt;
      // follow the gap, then dive at the player when within range
      const close = Math.max(0, Math.min(1, (300 - (e.x - b.x)) / 180));
      const target = gapCenterAt(e.x) + (b.y - gapCenterAt(e.x)) * ENEMY_AIM * close;
      e.y += (target - e.y) * Math.min(1, dt * 4);
    }
    state.enemies = state.enemies.filter(e => e.x > -60);

    // Missiles lock on to the nearest enemy jet ahead and steer toward it,
    // until they hit a jet or rock (blasting its top off), or leave the screen
    for (const m of state.missiles) {
      let target = null, nearest = MISSILE_RANGE;
      for (const e of state.enemies) {
        const d = Math.hypot(e.x - m.x, e.y - m.y);
        if (!e.dead && e.x > m.x - 10 && d < nearest) { nearest = d; target = e; }
      }
      m.target = target;
      if (target) {
        const heading = Math.atan2(m.vy, m.vx);
        let turn = Math.atan2(target.y - m.y, target.x - m.x) - heading;
        turn = Math.atan2(Math.sin(turn), Math.cos(turn)); // shortest way round
        const a = heading + Math.max(-MISSILE_TURN * dt, Math.min(MISSILE_TURN * dt, turn));
        m.vx = Math.cos(a) * MISSILE_SPEED;
        m.vy = Math.sin(a) * MISSILE_SPEED;
      }
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      const noseX = m.x + m.vx / MISSILE_SPEED * 10, noseY = m.y + m.vy / MISSILE_SPEED * 10;
      const e = state.enemies.find(e => !e.dead && Math.abs(e.x - m.x) < 28 && Math.abs(e.y - m.y) < 14);
      const rock = e ? null : rockHit(noseX, noseY);
      if (e) {
        m.dead = true;
        kill(e);
      } else if (rock) {
        m.dead = true;
        explode(noseX, noseY, 22);
        blast(rock.p, rock.part, BLAST, noseX, noseY, 14);
      } else if (noseY >= GROUND) {
        m.dead = true;
        explode(noseX, GROUND, 14);
      } else if (m.x > W + 20 || m.x < -20 || m.y < -20) {
        m.dead = true;
      }
    }
    state.enemies = state.enemies.filter(e => !e.dead);
    state.missiles = state.missiles.filter(m => !m.dead);

    // Laser: a beam from the nose that downs jets and melts rock where it lands
    if (state.laser > 0) {
      state.laser = Math.max(0, state.laser - dt);
      const y = b.y + 1;
      let endX = W + 10, hit = null;
      for (let x = b.x + 34; x < W + 10; x += 6) {
        hit = rockHit(x, y);
        if (hit) { endX = x; break; }
      }
      state.beamEnd = endX;
      if (hit) blast(hit.p, hit.part, LASER_CUT * dt, endX, y, Math.random() < dt * 25 ? 1 : 0);
      for (const e of state.enemies) {
        if (e.x - 30 < endX && e.x + 30 > b.x && Math.abs(e.y - y) < 18) kill(e);
      }
      state.enemies = state.enemies.filter(e => !e.dead);
    }

    // Pickups drift with the canyon. Missile rings reload one missile; laser tokens switch the laser on.
    for (const k of state.pickups) {
      k.x -= speed * dt;
      if (Math.hypot(k.x - b.x, k.y - b.y) >= 30) continue;
      if (k.kind === 'laser') {
        k.dead = true;
        state.laser = LASER_TIME;
        state.popups.push({ x: k.x, y: k.y - 22, t: 0, text: 'LASER!' });
      } else if (state.ammo < MAX_AMMO) {
        k.dead = true;
        state.ammo++;
        state.popups.push({ x: k.x, y: k.y - 22, t: 0, text: '+1 missile' });
      }
    }
    state.pickups = state.pickups.filter(k => !k.dead && k.x > -30);

    // Collisions
    if (b.y + 7 >= GROUND) { b.y = GROUND - 7; gameOver(); return; }
    if (b.y - b.r < 4) { b.y = 4 + b.r; b.vy = 0; }
    for (const [dx, dy] of JET_POINTS) {
      if (rockHit(b.x + dx, b.y + dy)) { gameOver(); return; }
    }
    for (const e of state.enemies) {
      if (Math.abs(e.x - b.x) < 46 && Math.abs(e.y - b.y) < 14) {
        explode(e.x, e.y, 26);
        state.enemies = state.enemies.filter(o => o !== e);
        gameOver();
        return;
      }
    }
  }

  // ---------- Drawing ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#1d2a4d');
    g.addColorStop(0.5, '#8a3f4f');
    g.addColorStop(0.8, '#e0703f');
    g.addColorStop(1, '#f6b65b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND);

    // Low sun with a soft glow
    const sx = W * 0.72, sy = GROUND - 150;
    const glow = ctx.createRadialGradient(sx, sy, 20, sx, sy, 190);
    glow.addColorStop(0, 'rgba(255,214,140,.55)');
    glow.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 100, W, GROUND - 100);
    ctx.fillStyle = '#ffe2a3';
    ctx.beginPath(); ctx.arc(sx, sy, 48, 0, Math.PI * 2); ctx.fill();

    // A distant contrail
    const cx = ((state.t * 14) % (W + 300)) - 150;
    ctx.strokeStyle = 'rgba(255,244,230,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 110, 90); ctx.lineTo(cx, 64); ctx.stroke();

    // Two jagged ridge layers with parallax
    ridge(0.12, GROUND - 70, 60, '#8a4a5a', 0.011);
    ridge(0.3, GROUND - 30, 44, '#5a3048', 0.019);
  }
  function tri(v) { const m = ((v % 2) + 2) % 2; return 1 - Math.abs(m - 1); }
  function ridge(par, base, amp, color, freq) {
    const off = reduceMotion ? 0 : state.dist * par;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W + 6; x += 6) {
      const u = x + off;
      const y = base - tri(u * freq) * amp - tri(u * freq * 2.7 + 0.3) * amp * 0.35;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, GROUND);
    ctx.fill();
  }

  // One rock spire. tip0 is where it originally pointed; cut is where it ends now
  // (the same until it gets blasted, then it has a broken flat top); endY is the floor or sky edge.
  function drawSpire(p, tip0, cut, endY, jagOffset) {
    const dir = endY > tip0 ? 1 : -1;
    if ((endY - cut) * dir <= 0) return; // blasted away completely
    const len = Math.abs(endY - cut);
    const pointed = Math.abs(cut - tip0) < 1;
    const left = [], right = [];
    for (let i = 0; i <= SEGMENTS; i++) {
      const y = cut + dir * (i / SEGMENTS) * len;
      const hw = TIP + Math.abs(y - tip0) * SLOPE;
      const edge = i > 0 && i < SEGMENTS;
      left.push([p.x - hw + (edge ? p.jag[jagOffset + i] : 0), y]);
      right.push([p.x + hw + (edge ? p.jag[jagOffset + SEGMENTS + i] : 0), y]);
    }
    const top = pointed ? [p.x, tip0 - dir * 6] : [p.x, cut];

    function outline() {
      ctx.beginPath();
      if (pointed) ctx.moveTo(top[0], top[1]);
      else {
        // broken, rubbly end where it was blasted
        ctx.moveTo(right[0][0], right[0][1]);
        for (let k = 4; k >= 1; k--) {
          ctx.lineTo(left[0][0] + (right[0][0] - left[0][0]) * k / 5, cut - dir * (k % 2 ? 4 : -3));
        }
      }
      for (const [x, y] of left) ctx.lineTo(x, y);
      for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
      ctx.closePath();
    }

    ctx.save();
    outline();
    ctx.fillStyle = '#a5523a';
    ctx.fill();
    ctx.clip();

    // shadowed right face
    ctx.fillStyle = '#6e3326';
    ctx.beginPath();
    ctx.moveTo(top[0], top[1]);
    for (let i = 0; i < right.length; i++) {
      const mid = p.x + (right[i][0] - p.x) * 0.1 + (i % 2 ? 3 : -3);
      ctx.lineTo(mid, right[i][1]);
    }
    for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i][0] + 8, right[i][1]);
    ctx.closePath();
    ctx.fill();

    // sandstone strata, fixed to the rock so they don't slide when it's blasted
    ctx.strokeStyle = 'rgba(255,200,140,.18)';
    ctx.lineWidth = 3;
    for (let k = 1; k < 14; k++) {
      const y = tip0 + dir * (k * 34 + 10);
      ctx.beginPath(); ctx.moveTo(p.x - 200, y); ctx.lineTo(p.x + 200, y + dir * 4); ctx.stroke();
    }

    // sunlit left rim
    ctx.strokeStyle = '#e08a55';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(pointed ? top[0] : left[0][0], pointed ? top[1] : left[0][1]);
    for (const [x, y] of left) ctx.lineTo(x + 1, y);
    ctx.stroke();

    // scorched edge where it was blasted
    if (!pointed) {
      ctx.fillStyle = 'rgba(40,18,14,.55)';
      ctx.fillRect(p.x - 200, dir > 0 ? cut - 6 : cut - 4, 400, 10);
    }
    ctx.restore();
  }

  function drawGround() {
    ctx.fillStyle = '#5a2f22';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#b8693d';
    ctx.fillRect(0, GROUND, W, 8);
    ctx.fillStyle = '#8a4a2c';
    for (let x = state.groundX - 24; x < W + 24; x += 24) {
      ctx.fillRect(x, GROUND + 16, 12, 3);
      ctx.fillRect(x + 8, GROUND + 32, 8, 3);
    }
  }

  const PLAYER_COLORS = { fin: '#5f687d', body: '#a3abbd', belly: '#7d8599', nose: '#3b3550', wing: '#6f7890', canopy: '#7fd3f0', mark: '#d9473a' };
  const ENEMY_COLORS = { fin: '#24262f', body: '#4e5363', belly: '#363a46', nose: '#1b1d24', wing: '#3a3e4a', canopy: '#ff9a7a', mark: '#ffc861' };

  function drawJet() {
    const b = state.bird;
    // afterburner flickers, flares while climbing or boosting, out after a crash
    const flare = state.mode === 'over' ? 0 : (state.boosting ? 2.6 : input.up || (FLAPPY && b.vy < -150) ? 1.6 : 1) * (0.8 + 0.2 * Math.sin(state.t * 50));
    drawPlane(b.x, b.y, b.angle, false, PLAYER_COLORS, flare);
  }

  function drawPlane(x, y, angle, facingLeft, c, flare) {
    ctx.save();
    ctx.translate(x, y);
    if (facingLeft) ctx.scale(-1, 1);
    ctx.rotate(angle);
    if (flare > 0) {
      ctx.fillStyle = '#ff8a3a';
      ctx.beginPath(); ctx.ellipse(-28 - 6 * flare, 0, 10 * flare, 4.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe28a';
      ctx.beginPath(); ctx.ellipse(-27 - 3 * flare, 0, 5 * flare, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    }
    // vertical tail fin
    ctx.fillStyle = c.fin;
    ctx.beginPath(); ctx.moveTo(-24, -4); ctx.lineTo(-30, -18); ctx.lineTo(-22, -18); ctx.lineTo(-10, -4); ctx.closePath(); ctx.fill();
    // fuselage with pointed nose
    ctx.fillStyle = c.body;
    ctx.beginPath();
    ctx.moveTo(32, 1); ctx.lineTo(16, -6); ctx.lineTo(-24, -6); ctx.lineTo(-27, 0); ctx.lineTo(-24, 6); ctx.lineTo(16, 6);
    ctx.closePath(); ctx.fill();
    // belly shade
    ctx.fillStyle = c.belly;
    ctx.fillRect(-24, 2, 40, 4);
    // nose tip
    ctx.fillStyle = c.nose;
    ctx.beginPath(); ctx.moveTo(32, 1); ctx.lineTo(24, -2.5); ctx.lineTo(24, 4); ctx.closePath(); ctx.fill();
    // canopy
    ctx.fillStyle = c.canopy;
    ctx.beginPath(); ctx.ellipse(10, -6, 9, 4.5, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillRect(6, -9, 5, 1.5);
    // swept delta wing
    ctx.fillStyle = c.wing;
    ctx.beginPath(); ctx.moveTo(10, 2); ctx.lineTo(-14, 16); ctx.lineTo(-20, 16); ctx.lineTo(-16, 2); ctx.closePath(); ctx.fill();
    // stripe and roundel
    ctx.fillStyle = c.mark;
    ctx.fillRect(-20, -2, 6, 3);
    ctx.beginPath(); ctx.arc(-6, 0, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawMissile(x, y, lit, angle = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    if (lit) {
      ctx.fillStyle = '#ffb347';
      ctx.beginPath(); ctx.ellipse(-13, 0, 4 + Math.random() * 3, 2, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#5f687d';
    ctx.fillRect(-9, -4, 3, 8);
    ctx.fillStyle = '#e6e9f0';
    ctx.fillRect(-9, -2, 16, 4);
    ctx.fillStyle = '#d9473a';
    ctx.beginPath(); ctx.moveTo(7, -2); ctx.lineTo(12, 0); ctx.lineTo(7, 2); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Red corner brackets around a jet a missile has locked on to
  function drawLock(e) {
    const s = 30 + Math.sin(state.t * 20) * 2, c = 9;
    ctx.strokeStyle = '#ff4d4d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const cx = e.x + sx * s, cy = e.y + sy * (s - 8);
      ctx.moveTo(cx - sx * c, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy - sy * c);
    }
    ctx.stroke();
  }

  function drawPickup(k) {
    const r = 15 + Math.sin(state.t * 5) * 1.5;
    if (k.kind === 'laser') {
      // cyan diamond token
      ctx.save();
      ctx.translate(k.x, k.y);
      ctx.rotate(Math.PI / 4 + (reduceMotion ? 0 : state.t * 1.5));
      ctx.fillStyle = 'rgba(90,240,255,.25)';
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.strokeStyle = '#5af0ff';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(-r * 0.75, -r * 0.75, r * 1.5, r * 1.5);
      ctx.restore();
      ctx.fillStyle = '#e8fdff';
      ctx.fillRect(k.x - 8, k.y - 1.5, 16, 3);
      return;
    }
    ctx.fillStyle = 'rgba(255,200,97,.25)';
    ctx.beginPath(); ctx.arc(k.x, k.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffc861';
    ctx.lineWidth = 2;
    ctx.stroke();
    drawMissile(k.x, k.y, false);
  }

  function drawBeam() {
    const b = state.bird, y = b.y + 1, x0 = b.x + 32, x1 = state.beamEnd;
    const w = 6 + Math.sin(state.t * 60) * 1.5;
    ctx.fillStyle = 'rgba(90,240,255,.3)';
    ctx.fillRect(x0, y - w, x1 - x0, w * 2);
    ctx.fillStyle = '#5af0ff';
    ctx.fillRect(x0, y - w / 3, x1 - x0, (w / 3) * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x0, y - 1, x1 - x0, 2);
    if (x1 < W) {
      ctx.fillStyle = 'rgba(255,240,180,.8)';
      ctx.beginPath(); ctx.arc(x1, y, 7 + Math.random() * 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawExplosion(x) {
    const k = x.t / 0.6;
    ctx.fillStyle = `rgba(255,${Math.round(190 - 110 * k)},70,${1 - k})`;
    ctx.beginPath(); ctx.arc(x.x, x.y, x.r * (0.4 + k), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,240,180,${Math.max(0, 1 - k * 1.6)})`;
    ctx.beginPath(); ctx.arc(x.x, x.y, x.r * 0.5 * (0.4 + k), 0, Math.PI * 2); ctx.fill();
  }

  function text(str, x, y, size, color = '#fff4e6', align = 'center', font = 'Bagel Fat One') {
    ctx.font = `${size}px "${font}", "Arial Rounded MT Bold", sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = size / 6;
    ctx.strokeStyle = '#1d1424';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }
  function arcade(str, x, y, size, color = '#fff4e6', align = 'left') {
    ctx.font = `${size}px "Press Start 2P", "Courier New", monospace`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function panel(x, y, w, h) {
    ctx.fillStyle = 'rgba(29,20,36,.88)';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 16); ctx.fill();
    ctx.strokeStyle = '#ffc861'; ctx.lineWidth = 3; ctx.stroke();
  }

  // Arcade-style table of this browser's best runs
  function drawBoard(cx, y, rows) {
    arcade('TOP SCORES', cx, y, 13, '#ffc861', 'center');
    if (!scores.length) {
      arcade('NO RUNS YET', cx, y + 34, 10, '#f6d7b8', 'center');
      return;
    }
    for (let i = 0; i < Math.min(rows, scores.length); i++) {
      const s = scores[i];
      const ry = y + 30 + i * 22;
      const mine = s === state.lastEntry;
      const color = mine ? '#ff8a3a' : i === 0 ? '#ffe28a' : '#fff4e6';
      arcade(`${String(i + 1).padStart(2, ' ')}.`, cx - 120, ry, 11, color);
      arcade(s.n, cx - 66, ry, 11, color);
      arcade(String(s.s).padStart(5, ' '), cx + 120, ry, 11, color, 'right');
    }
  }

  // Ground buttons: Fire on the left, Boost on the right
  function fireBtn() { return { x: 16, y: GROUND + 9, w: 170, h: 52 }; }
  function boostBtn() { return { x: W - 186, y: GROUND + 9, w: 170, h: 52 }; }
  function fsBtn() { return { x: W - 56, y: 14, w: 42, h: 42 }; }
  function inside(r, x, y) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

  function drawBoost() {
    const { x, y, w, h } = boostBtn();
    const ready = state.boosting || state.fuel > BOOST_MIN;
    ctx.fillStyle = 'rgba(29,20,36,.75)';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill();
    ctx.fillStyle = state.boosting ? '#ff8a3a' : ready ? '#ffc861' : '#8a6a5a';
    ctx.beginPath(); ctx.roundRect(x + 4, y + 4, (w - 8) * state.fuel, h - 8, 9); ctx.fill();
    ctx.strokeStyle = state.boosting ? '#ffe28a' : '#ffc861';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.stroke();
    text(FLAPPY ? 'BOOST' : 'BOOST  →', x + w / 2, y + h / 2 + 1, 20);
  }

  function drawFire() {
    const { x, y, w, h } = fireBtn();
    const empty = state.ammo === 0;
    ctx.fillStyle = 'rgba(29,20,36,.75)';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill();
    ctx.strokeStyle = state.emptyFlash > 0 ? '#ef6b3a' : empty ? '#8a6a5a' : '#ffc861';
    ctx.lineWidth = 2;
    ctx.stroke();
    text('FIRE', x + 46, y + h / 2 + 1, 20, empty ? '#8a6a5a' : '#fff4e6');
    for (let i = 0; i < MAX_AMMO; i++) {
      ctx.globalAlpha = i < state.ammo ? 1 : 0.25;
      drawMissile(x + 108 + i * 32, y + h / 2, false);
    }
    ctx.globalAlpha = 1;
  }

  function drawFullscreenButton() {
    if (!canFullscreen) return;
    const { x, y, w, h } = fsBtn();
    ctx.fillStyle = 'rgba(29,20,36,.6)';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = '#fff4e6';
    ctx.lineWidth = 2.5;
    const m = 11, c = 8, on = !!document.fullscreenElement;
    ctx.beginPath();
    for (const [sx, sy] of [[0, 0], [1, 0], [1, 1], [0, 1]]) {
      const px = x + (sx ? w - m : m), py = y + (sy ? h - m : m);
      const ix = sx ? -1 : 1, iy = sy ? -1 : 1;
      if (on) { ctx.moveTo(px + ix * c, py); ctx.lineTo(px + ix * c, py + iy * c); ctx.lineTo(px, py + iy * c); }
      else { ctx.moveTo(px, py + iy * c); ctx.lineTo(px, py); ctx.lineTo(px + ix * c, py); }
    }
    ctx.stroke();
  }

  function drawHUD() {
    if (state.mode !== 'over') { drawBoost(); drawFire(); }
    drawFullscreenButton();
    for (const p of state.popups) {
      ctx.globalAlpha = 1 - p.t / 0.9;
      text(p.text, p.x, p.y, 18, p.text === 'LASER!' ? '#5af0ff' : '#ffc861', 'center', 'Nunito');
    }
    ctx.globalAlpha = 1;

    if (state.mode === 'play' || state.mode === 'paused') {
      text(String(state.score), W / 2, 50, 50);
      let y = 92;
      if (state.boosting) { text('2× points', W / 2, y, 18, '#ffc861', 'center', 'Nunito'); y += 26; }
      if (state.laser > 0) {
        text('LASER', W / 2 - 56, y, 16, '#5af0ff', 'center', 'Nunito');
        ctx.fillStyle = 'rgba(29,20,36,.7)';
        ctx.fillRect(W / 2 - 24, y - 5, 90, 10);
        ctx.fillStyle = '#5af0ff';
        ctx.fillRect(W / 2 - 24, y - 5, 90 * state.laser / LASER_TIME, 10);
      }
      if (state.emptyFlash > 0) text('Out of missiles: grab a ◯ pickup', W / 2, GROUND - 24, 16, '#ef6b3a', 'center', 'Nunito');
    }

    if (state.mode === 'ready') {
      const cx = Math.max(W * 0.6, 430);
      text('Canyon Run', W / 2, 74, 58, '#ffc861');
      const pulse = reduceMotion ? 1 : 0.75 + 0.25 * Math.sin(state.t * 4);
      ctx.globalAlpha = pulse;
      text(FLAPPY ? 'Tap to take off' : 'Press ↑ to take off', cx, 140, 24);
      ctx.globalAlpha = 1;
      const lines = FLAPPY
        ? ['Tap anywhere to flap · hold BOOST for 2× points', 'Tap FIRE for homing missiles · fly through ◯ to reload', 'Grab a ◆ laser token to switch the laser on']
        : ['↑ climb · ↓ dive · let go to hover · → boost for 2× points', 'Space fires homing missiles · fly through ◯ to reload', 'Grab a ◆ laser token to switch the laser on · P pause'];
      lines.forEach((l, i) => text(l, cx, 176 + i * 24, 15, i === 2 ? '#5af0ff' : '#f6d7b8', 'center', 'Nunito'));
      panel(cx - 170, 262, 340, 186);
      drawBoard(cx, 286, 6);
    }
    if (state.mode === 'paused') {
      text('Paused', W / 2, 230, 40);
      text(FLAPPY ? 'Tap to resume' : 'Press P or ↑ to resume', W / 2, 276, 18, '#f6d7b8', 'center', 'Nunito');
    }
    if (state.mode === 'over' && !state.entering) {
      const px = W / 2 - 300;
      panel(px, 60, 600, 360);
      text('Game over', W / 2, 98, 34, '#ef6b3a');
      const lx = W / 2 - 160;
      text('Score', lx, 150, 16, '#f6d7b8', 'center', 'Nunito');
      text(String(state.score), lx, 188, 44);
      text('Best', lx - 60, 244, 15, '#f6d7b8', 'center', 'Nunito');
      text(String(best), lx - 60, 274, 30, '#ffc861');
      text('Jets down', lx + 60, 244, 15, '#f6d7b8', 'center', 'Nunito');
      text(String(state.kills), lx + 60, 274, 30, '#ff8a3a');
      if (state.newBest) text('New best!', lx, 322, 18, '#ffc861');
      drawBoard(W / 2 + 140, 140, 10);
      if (state.t - state.overAt > 0.5) text(FLAPPY ? 'Tap to fly again' : 'Press ↑ to fly again', W / 2, 446, 20);
    }
    if (state.mode === 'over' && state.entering) {
      ctx.fillStyle = 'rgba(20,15,31,.5)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function draw() {
    drawSky();
    for (const p of state.peaks) {
      drawSpire(p, p.top0, p.top, -10, 0);
      drawSpire(p, p.bot0, p.bot, GROUND + 10, SEGMENTS * 2 + 2);
    }
    for (const k of state.pickups) drawPickup(k);
    drawGround();
    if (state.boosting && !reduceMotion) {
      // speed streaks
      ctx.strokeStyle = 'rgba(255,244,230,.35)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 14; i++) {
        const y = (i * 71 + 13) % (GROUND - 20);
        const x = W + 40 - ((state.dist * 1.5 + i * 97) % (W + 80));
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 46, y); ctx.stroke();
      }
    }
    for (const e of state.enemies) {
      drawPlane(e.x, e.y, 0, true, ENEMY_COLORS, 0.8 + 0.2 * Math.sin(state.t * 50 + e.seed));
    }
    for (const e of new Set(state.missiles.map(m => m.target).filter(e => e && !e.dead))) drawLock(e);
    for (const m of state.missiles) drawMissile(m.x, m.y, true, Math.atan2(m.vy, m.vx));
    if (state.laser > 0 && state.mode === 'play') drawBeam();
    if (state.mode !== 'over' || state.t - state.overAt < 0.15) drawJet();
    for (const d of state.debris) { ctx.fillStyle = d.c; ctx.fillRect(d.x, d.y, d.s, d.s); }
    for (const x of state.explosions) drawExplosion(x);
    drawHUD();
    if (state.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${state.flash * 0.6})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (portraitPhone.matches && state.mode === 'play') state.mode = 'paused';
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- Input ----------
  const UP_KEYS = ['ArrowUp', 'KeyW'];
  const FIRE_KEYS = ['Space', 'KeyF', 'Enter'];
  const DOWN_KEYS = ['ArrowDown', 'KeyS'];
  const BOOST_KEYS = ['ArrowRight', 'KeyD', 'ShiftLeft', 'ShiftRight'];

  // Each finger remembers what it is holding, so a thumb can keep Boost held while the other taps
  const held = new Map();
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.focus();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const r = canvas.getBoundingClientRect();
    const lx = (e.clientX - r.left) / r.width * W;
    const ly = (e.clientY - r.top) / r.height * H;
    if (canFullscreen && inside(fsBtn(), lx, ly)) { toggleFullscreen(); return; }
    if (ly > GROUND) {
      if (lx < W / 2) fire();
      else { press('boost'); held.set(e.pointerId, 'boost'); }
    } else if (FLAPPY) {
      flap();
    } else {
      // mouse in hover mode: hold the top part to climb, lower down to dive
      const dir = ly > H * 0.6 ? 'down' : 'up';
      press(dir);
      held.set(e.pointerId, dir);
    }
  });
  const lift = (e) => {
    const action = held.get(e.pointerId);
    if (action) { input[action] = false; held.delete(e.pointerId); }
  };
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', lift);
  window.addEventListener('blur', () => { release(); held.clear(); });

  window.addEventListener('keyup', (e) => {
    if (e.target === iniInput) return;
    if (UP_KEYS.includes(e.code)) input.up = false;
    if (DOWN_KEYS.includes(e.code)) input.down = false;
    if (BOOST_KEYS.includes(e.code)) input.boost = false;
  });
  window.addEventListener('keydown', (e) => {
    if (e.target === iniInput) return; // typing initials
    if (UP_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) FLAPPY ? flap() : press('up'); }
    if (DOWN_KEYS.includes(e.code) && !FLAPPY) { e.preventDefault(); if (!e.repeat) press('down'); }
    if (BOOST_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press('boost'); }
    if (FIRE_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) fire(); }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state.mode === 'play') state.mode = 'paused';
      else if (state.mode === 'paused') state.mode = 'play';
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.mode === 'play') state.mode = 'paused';
  });

  resize();
  reset();
  canvas.focus();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
